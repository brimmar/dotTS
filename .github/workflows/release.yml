name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run ci

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: dotts-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: dotts-linux-arm64
          - os: macos-13
            target: darwin-x64
            artifact: dotts-darwin-x64
          - os: macos-latest
            target: darwin-arm64
            artifact: dotts-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun build ./src/index.ts --compile --outfile ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dotts-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum dotts-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dotts-*
            checksums.txt
          generate_release_notes: true
